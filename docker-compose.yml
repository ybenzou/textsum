services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: summarizer-backend
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model  # 模型挂载为 volume，避免 COPY 占用镜像空间
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: summarizer-frontend
    ports:
      - "80:80"
    restart: unless-stopped
